name: OCI Instance Sniper

on:
  schedule:
    # Běží každých 30 minut (jako pojistka)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Možnost spustit ručně tlačítkem v GitHubu

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare OCI Key File
        run: |
          mkdir -p ~/.oci
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_KEY_CONTENT }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run Sniper
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          INSTANCE_OCPUS: ${{ vars.INSTANCE_OCPUS || '1' }}
          INSTANCE_MEMORY_GBS: ${{ vars.INSTANCE_MEMORY_GBS || '1' }}
          BOOT_VOLUME_GB: ${{ vars.BOOT_VOLUME_GB || '50' }}
          MAX_RUNTIME_MINUTES: 28
          RETRY_DELAY_SECONDS: 35
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sniper.py

      - name: Retrigger next shift immediately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f INSTANCE_FOUND.txt ]; then
            echo "🎉 Instance byla úspěšně ulovena! Řetězové spouštění zastaveno."
          else
            echo "🚀 Instance ještě nebyla ulovena. Spouštím další 28minutovou směnu okamžitě..."
            gh workflow run sniper.yml || echo "Nelze spustit přes gh cli, plánovač cron to pokryje."
          fi
